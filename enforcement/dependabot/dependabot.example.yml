# Copy to .github/dependabot.yml and adjust the ecosystem.
# Mirrors: AGE-1 for update pull requests.
# The cooldown applies to version updates only. Security updates are not delayed,
# which matches the security-fix fast path (FIX-1).

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
